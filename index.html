<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Menu Calculator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f7;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .menu-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
    }
    .item-info span {
      display: block;
      color: #666;
      font-size: 0.9rem;
    }
    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background-color: #0070f3;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { background-color: #0051a8; }
    .qty {
      font-size: 1.1rem;
      font-weight: bold;
      width: 20px;
      text-align: center;
    }
    .customer-info {
      margin-bottom: 20px;
    }
    .customer-info input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
    }
    .validation-message {
      font-size: 0.85rem;
      color: red;
      margin-top: -5px;
      margin-bottom: 10px;
    }
    .total-section {
      margin-top: 30px;
      border-top: 2px solid #eee;
      padding-top: 20px;
      font-size: 1.1rem;
      color: #111;
    }
    .summary {
      margin-top: 15px;
      font-weight: bold;
      color: #333;
      white-space: pre-line; /* allows line breaks to render */
    }
    #checkout-btn {
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }
    #checkout-btn:hover { background-color: #1e7e34; }
    #cancel-btn {
      margin-top: 10px;
      background-color: #6c757d;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }
    #cancel-btn:hover { background-color: #5a6268; }
    #reset-btn {
      margin-top: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }
    #reset-btn:hover { background-color: #0069d9; }
    /* Confirmation modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 360px;
      width: 100%;
      padding: 25px;
      text-align: center;
      animation: pop-in 0.2s ease-out;
    }
    @keyframes pop-in {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal .modal-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .modal h3 {
      margin: 0 0 10px;
      color: #333;
      border: none;
      padding: 0;
    }
    .modal .modal-details {
      font-size: 0.95rem;
      color: #555;
      text-align: left;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 20px;
      white-space: pre-line;
      line-height: 1.5;
    }
    .modal .modal-total {
      color: #28a745;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .modal .modal-status {
      font-size: 0.95rem;
      text-align: left;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.45;
    }
    .modal .modal-status.pending { background: #eef4ff; color: #1d4f91; }
    .modal .modal-status.ok      { background: #e8f7ec; color: #1e7b34; }
    .modal .modal-status.fail    { background: #fdecec; color: #a12525; }
    .modal .modal-status a       { color: #a12525; }
    .modal button:disabled { opacity: 0.55; cursor: default; }
    .modal button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    .modal .btn-ok { background-color: #28a745; color: white; }
    .modal .btn-ok:hover { background-color: #1e7e34; }
    .menu-note { color: #666; font-style: italic; padding: 8px 4px; }
</style>
</head>
<body>

<div class="menu-card">
  <h2>Love Sweety Spice Order Form</h2>

  <h2>Customer Information</h2>
  <div class="customer-info">
    <input type="text" id="customer-name" placeholder="Your Name" required>
    <input type="tel" id="customer-phone" placeholder="Phone Number" 
           required pattern="[0-9]{8,}" 
           title="Phone number must be at least 8 digits long and contain only numbers">
    <input type="email" id="customer-email" placeholder="Email Address" required>
  </div>

  <h2>Our Menu</h2>
  
<div id="menu-list">
  <p id="menu-status" class="menu-note">Loading the menu&hellip;</p>
</div>

  <!-- Total -->
  <div class="total-section">
    <div><strong>Order Total:</strong> <span id="order-total">MOP 0.00</span></div>
    <div class="summary" id="customer-summary"></div>
    <!-- Checkout button -->
    <button id="checkout-btn">Place Order</button>
    <button id="reset-btn">Reset Item Counts</button>
    <button id="cancel-btn">Clear Order Form</button>
  </div>
</div>

<!-- Order confirmation modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h3>Thanks &mdash; here is your order</h3>
    <div class="modal-status pending" id="modal-status">Sending your order&hellip;</div>
    <div class="modal-details" id="modal-details"></div>
    <button class="btn-ok" id="modal-ok" disabled>Sending&hellip;</button>
  </div>
</div>

<script>
  // --- Menu: rendered from the LSS catalogue, keyed by SKU code -----------
  // 27 Nov SKU switch: the page no longer bakes in names or prices. It loads
  // GET /api/lss/menu (items: code, name, price cents, min_qty), renders the
  // menu from it, and the cart sends {code, qty} to the intake. The last good
  // catalogue is cached in localStorage so a brief NAS outage still shows the
  // menu (clearly flagged as cached); with no cache at all we say so.
  const MENU_URL = 'https://ugreen-nas.taila4f294.ts.net:8443/api/lss/menu';
  const MENU_CACHE_KEY = 'lss-menu-v1';

  const money = cents => 'MOP ' + (cents / 100).toFixed(2);

  function renderMenu(items, fromCache) {
    const list = document.getElementById('menu-list');
    list.innerHTML = '';
    if (fromCache) {
      const note = document.createElement('p');
      note.className = 'menu-note';
      note.textContent = '(Showing the saved menu - prices could be out of date.)';
      list.appendChild(note);
    }
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'menu-item';
      row.setAttribute('data-code', it.code);
      row.setAttribute('data-price', (it.price / 100).toFixed(2));
      if (it.min_qty > 0) row.setAttribute('data-min', it.min_qty);
      const label = it.min_qty > 0 ? `${it.name} (min ${it.min_qty} pcs)` : it.name;
      row.innerHTML =
        `<div class="item-info"><strong>${label}</strong><span>${money(it.price)}</span></div>` +
        '<div class="quantity-selector"><button class="btn minus">-</button>' +
        '<span class="qty">0</span><button class="btn plus">+</button></div>';
      list.appendChild(row);
    });
    wireMenu();
    calculateTotal();
    const st = document.getElementById('menu-status');
    if (st) st.remove();
  }

  function wireMenu() {
    document.querySelectorAll('.menu-item').forEach(item => {
      const minusBtn = item.querySelector('.minus');
      const plusBtn = item.querySelector('.plus');
      const qtyDisplay = item.querySelector('.qty');
      const minQty = parseInt(item.getAttribute('data-min')) || 1;

      minusBtn.addEventListener('click', () => {
        let qty = parseInt(qtyDisplay.textContent);
        if (qty > 0) {
          // Drop straight to 0 if going below the minimum, otherwise decrement
          qty = (qty <= minQty) ? 0 : qty - 1;
          qtyDisplay.textContent = qty;
          calculateTotal();
        }
      });

      plusBtn.addEventListener('click', () => {
        let qty = parseInt(qtyDisplay.textContent);
        // Jump straight to the minimum when starting from 0
        qty = (qty === 0) ? minQty : qty + 1;
        qtyDisplay.textContent = qty;
        calculateTotal();
      });
    });
  }

  function loadMenu() {
    fetch(MENU_URL)
      .then(r => {
        if (!r.ok) throw new Error('menu ' + r.status);
        return r.json();
      })
      .then(d => {
        if (!d.ok || !Array.isArray(d.items) || d.items.length === 0) throw new Error('empty menu');
        try { localStorage.setItem(MENU_CACHE_KEY, JSON.stringify(d.items)); } catch (e) {}
        renderMenu(d.items, false);
      })
      .catch(() => {
        try {
          const cached = JSON.parse(localStorage.getItem(MENU_CACHE_KEY) || 'null');
          if (cached && cached.length) { renderMenu(cached, true); return; }
        } catch (e) {}
        document.getElementById('menu-list').innerHTML =
          '<p class="menu-note">The menu could not be loaded right now.' +
          ' Please refresh the page, or phone the shop to place your order.</p>';
      });
  }
  loadMenu();

  function calculateTotal() {
    let total = 0;
    let summaryText = [];
    document.querySelectorAll('.menu-item').forEach(item => {
      const price = parseFloat(item.getAttribute('data-price'));
      const qty = parseInt(item.querySelector('.qty').textContent);
      const name = item.querySelector('strong').textContent;
      if (qty > 0) {
        total += price * qty;
        summaryText.push(`• ${qty} × ${name}`);
      }
    });
    document.getElementById('order-total').textContent = `MOP ${total.toFixed(2)}`;

    // Show itemized summary with bullet points
    const items = summaryText.length > 0 ? summaryText.join('\n') : "No items selected";
    document.getElementById('customer-summary').textContent = `Items:\n${items}`;
  }

  // Live validation feedback using the browser's built-in validity model
  // (messages appear as you type, using each input's own validation rules)
  const formInputs = document.querySelectorAll('#customer-name, #customer-phone, #customer-email');

  formInputs.forEach(input => {
    input.addEventListener('input', () => {
      // Clear the custom hint once the field becomes valid again
      if (input.checkValidity()) {
        input.style.borderColor = '';
      } else if (input.value.trim() !== '') {
        // Soft hint: outline the field while it's non-empty but invalid
        input.style.borderColor = 'red';
      }
    });
  });


  // Reset Item Counts button: only quantities, leave customer info alone
  document.getElementById('reset-btn').addEventListener('click', () => {
    document.querySelectorAll('.menu-item .qty').forEach(q => q.textContent = '0');
    calculateTotal();
  });

  // Clear button resets all quantities to 0 and clears customer info
  document.getElementById('cancel-btn').addEventListener('click', () => {
    document.querySelectorAll('.menu-item .qty').forEach(q => q.textContent = '0');
    formInputs.forEach(input => {
      input.value = '';
      input.style.borderColor = '';
    });
    calculateTotal();
  });

  // Checkout: use the browser's built-in validation (checkValidity / reportValidity)
  // plus the custom minimum-quantity rule
  document.getElementById('checkout-btn').addEventListener('click', () => {
    // 1. Custom rule first: at least one item must be selected
    let itemCount = 0;
    document.querySelectorAll('.menu-item .qty').forEach(q => {
      itemCount += parseInt(q.textContent);
    });
    if (itemCount === 0) {
      alert("Please add at least one item to your order before placing it.");
      return;
    }

    // 2. Let the browser report the first invalid field (name, phone pattern, email)
    let allValid = true;
    formInputs.forEach(input => {
      if (!input.checkValidity()) {
        allValid = false;
      }
    });
    if (!allValid) {
      // reportValidity() focuses the first invalid field and shows its message
      formInputs.forEach(input => { if (!input.checkValidity()) input.reportValidity(); });
      return;
    }

    const totalNum = document.getElementById('order-total').textContent.replace('MOP ', '');

    const name = document.getElementById('customer-name').value.trim();
    const phone = document.getElementById('customer-phone').value.trim();
    const email = document.getElementById('customer-email').value.trim();

    // Build the items list as plain lines for the sheet/email, plus structured items for LSS
    const itemLines = [];
    const lssItems = [];
    document.querySelectorAll('.menu-item').forEach(item => {
      const qty = parseInt(item.querySelector('.qty').textContent);
      if (qty > 0) {
        const label = item.querySelector('strong').textContent;
        itemLines.push(`${qty} × ${label}`);
        // SKU switch: the intake matches on code only; the label is display text.
        lssItems.push({ code: item.getAttribute('data-code'), qty: qty, label: label });
      }
    });
    const itemsStr = itemLines.join('\n');

    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const orderTime = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

    const SHEET_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxBZqQx_VuBtf2jQI_uvM091TSEfxY2o0dBP92O5ASmQ4hPvh97fvVF5aPDYhqiWzbe/exec';

    const payload = JSON.stringify({
      name, phone, email,
      items: itemsStr,
      total: totalNum,
      timestamp: orderTime
    });

    // --- Show the order immediately, then report the REAL outcome ----------
    // 26 Nov: no more silent fire-and-forget. The customer sees "sending",
    // then either a confirmed order number or a clear failure with a retry.
    document.getElementById('modal-details').textContent =
      `Customer: ${name}\nPhone: ${phone}\nEmail: ${email}\n\n${document.getElementById('customer-summary').textContent}\n\nTotal: ${document.getElementById('order-total').textContent}`;
    document.getElementById('confirm-modal').classList.add('show');

    const statusEl = document.getElementById('modal-status');
    const okBtn = document.getElementById('modal-ok');
    const INTAKE_URL = 'https://ugreen-nas.taila4f294.ts.net:8443/api/lss/orders/intake';

    // One key per order: a retry re-sends the SAME key, so the intake ignores
    // it as a replay instead of creating a second order.
    const sheetRow = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

    // The Google Sheet row is the shop's own paper trail; it runs in the
    // background and is never presented to the customer as the confirmation.
    fetch(SHEET_WEBAPP_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload
    }).catch(() => {});

    // Shop emails (Russel + Hazel) are the fallback channel: if the intake is
    // down these still reach the shop, so the order is never lost.
    const submitForm = (code, tag = '') => fetch(`https://formsubmit.co/ajax/${code}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        _subject: `New Order - Love Sweety Spice (${name})${tag}`,
        _template: 'table',
        Timestamp: orderTime,
        Customer: name,
        Phone: phone,
        Email: email,
        Order: itemsStr,
        Total: `MOP ${totalNum}`
      })
    }).catch(() => {});

    let attempt = 0;  // 1 = first send; 2+ = a retry. Repeats are flagged in
                      // the shop email subject so the shop isn't confused.
    let emailed = false;  // 27 Nov: the shop email is the NOTIFICATION channel
                          // (Hazel reads it), not just a failure fallback — it
                          // fires on success too, exactly once per order.
    const sendToLss = async () => {
      attempt++;
      statusEl.className = 'modal-status pending';
      statusEl.textContent = 'Sending your order\u2026';
      okBtn.disabled = true;
      okBtn.textContent = 'Sending\u2026';

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      try {
        const res = await fetch(INTAKE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            order: {
              sheet_row: sheetRow,
              name: name, phone: phone, email: email,
              items: lssItems,
              total: Math.round(parseFloat(totalNum) || 0),
              placed_at: orderTime
            }
          }),
          signal: ctrl.signal
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || ('server said ' + res.status));

        if (!emailed) {
          emailed = true;
          submitForm('4feecbd86366b628f6d87a89713f8d20');  // Russel
          submitForm('f4552e214157d7779ad8a18ff6d54af9');  // Hazel
        }
        statusEl.className = 'modal-status ok';
        statusEl.textContent = data.replay
          ? 'Order received \u2713 (already recorded)'
          : `Order received \u2713  Reference #${data.order_id || data.id || 'recorded'}`;
        okBtn.textContent = 'Done';
        okBtn.disabled = false;
      } catch (err) {
        // Tell the shop by email whatever happens — it is the notification
        // channel. A retry adds a REPEAT flag so repeats are obvious.
        const tag = attempt > 1 ? ` - REPEAT (attempt ${attempt}, not a second order)` : '';
        if (!emailed) {
          emailed = true;
          submitForm('4feecbd86366b628f6d87a89713f8d20', tag);  // Russel
          submitForm('f4552e214157d7779ad8a18ff6d54af9', tag);  // Hazel
        }
        statusEl.className = 'modal-status fail';
        statusEl.innerHTML = 'We could not confirm your order reached us. ' +
          '<br>We have emailed it to the shop instead \u2014 please also call us to be sure.' +
          '<br><small>(regarding: ' + (err && err.message ? err.message : 'network error') + ')</small>';
        okBtn.textContent = 'Try again';
        okBtn.disabled = false;
      } finally {
        clearTimeout(timer);
      }
    };

    okBtn.onclick = () => {
      if (okBtn.textContent === 'Try again') { sendToLss(); return; }
      document.getElementById('confirm-modal').classList.remove('show');
    };

    sendToLss();
  });

  // Close modal and clear the form for the next order.
  // Only acts on "Done": while the order is sending, or on "Try again", it
  // must not wipe the customer's basket.
  document.getElementById('modal-ok').addEventListener('click', () => {
    const btn = document.getElementById('modal-ok');
    const shown = document.getElementById('confirm-modal').classList.contains('show');
    if (!shown || btn.textContent.trim() !== 'Done') return;
    document.getElementById('confirm-modal').classList.remove('show');

    // Reset all item quantities to 0
    document.querySelectorAll('.menu-item .qty').forEach(q => q.textContent = '0');

    // Clear customer info fields and remove any validation highlights
    formInputs.forEach(input => {
      input.value = '';
      input.style.borderColor = '';
    });

    // Recalculate totals so everything shows a fresh, empty order
    calculateTotal();
  });
</script>

</body>
</html>
